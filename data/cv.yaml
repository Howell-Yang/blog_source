projects:
  - title: "From PTQ to QAD: quantization that matches the float model"
    where: QCraft · 2023–2026
    page: /projects/float-consistent-quantization/
    metric: "2 → 0.5"
    metric_label: points of quantization loss
    text: "Four generations of method (scale-search PTQ, LSQ-based AutoQuant, distillation-based QAT, large-scale QAD), each introduced as models grew more complex. The goal moved from average-metric parity to case-level consistency with the float model."
  - title: Adaptive lookup tables for non-linear operators
    where: QCraft · 2026
    page: /projects/adaptive-lut/
    metric: "≤ 2 LSB"
    metric_label: worst-case error, 85% fewer tables
    text: "An error-driven segmentation algorithm for fixed-point lookup tables (rsqrt, reciprocal, exp, sigmoid). It bisects only where the real fixed-point error is high, guaranteeing 2 LSB worst-case error with 12–30 tables per operator instead of 126."
  - title: Layered numerical consistency and release gates
    where: QCraft · 2024–2026
    page: /projects/numerical-consistency/
    metric: "12"
    metric_label: checkpoints, camera to on-board
    text: "Every stage from vehicle data to on-board post-processing is compared with the one before on identical inputs, so a mismatch has exactly one possible source. Results carry an evidence grade, and past failures re-run before every release."
  - title: Predicting on-board latency before writing code
    where: QCraft · 2025–2026
    page: /projects/latency-modeling/
    metric: "0.7%"
    metric_label: prediction error on board
    text: "A block-level latency model predicted 19.38 ms against 19.25 ms measured. It ruled out a wider occupancy range at 10 Hz early, ranked six deployment options, and led to a backbone shared by five perception models."
  - title: QNN Web, one-click model conversion for every chip
    where: QCraft · 2022–2026
    page: /projects/qnn-web/
    metric: "4,273"
    metric_label: production conversions
    text: "A conversion service: upload a model once and get engines for every target chip. Configs are generated from the graph, a TensorRT timing cache cut builds to about 5 minutes, and an MCP layer lets AI agents submit and track jobs."
  - title: Urban NOA on a new chip (AXERA M95)
    where: QCraft · 2026
    page: /projects/axera-m95/
    metric: "350"
    metric_label: TOPS target chip
    text: "Technical lead for porting the urban NOA stack: staged bring-up from a 700-TOPS demo board to the M95, model adaptation and quantization, and clustered road-test issues. The v4 stack runs on test vehicles with no frame drops on key models."
  - title: TensorRT INT8 for cloud GPU models, and onnx2trt
    where: Tencent Maps · 2021–2022
    page: /projects/tensorrt-int8/
    url: https://github.com/Howell-Yang/onnx2trt
    metric: "≈ ¥3M"
    metric_label: compute cost saved
    text: "An INT8 quantization and deployment pipeline for cloud GPU models: cosine similarity above 0.999 to float, latency −20%, GPU utilization and memory −10%. The calibration tooling became the open-source onnx2trt."
  - title: AR navigation perception SDK
    where: Tencent Maps · 2021–2022
    page: /projects/ar-navigation/
    video: /public/img/AR_Navi_Map.mp4
    text: "A multi-stream parallel perception framework with automatic profiling for phones and car head units: road-scene detection, parking-slot detection and AR guidance. 12 features in four months, CPU under 70%, shipped on the JMC CX743 production vehicle."
  - title: NBT evaluation platform
    where: Tencent Maps · 2021–2022
    page: /projects/nbt-evaluation/
    image: /public/img/nbt_eval_v1.png
    text: "Internal web platform for model and data management, evaluation runs, result tracking and data sharing, with interfaces for bad-case analysis, returned-data management and map-building visualization."


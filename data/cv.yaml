profile:
  name: Yang Hao
  name_alt: 杨豪
  title: Model Quantization & Deployment Lead
  affiliation: QCraft (轻舟智航) · Perception ML-Infra
  avatar: /public/img/avatar.jpg
  email: howellyang@buaa.edu.cn
  github: Howell-Yang
  # Optional: put a PDF at static/files/ and set the path, e.g. /files/YangHao_CV.pdf
  cv_pdf: /files/YangHao_CV.pdf
  bio:
    - >-
      I take deep-learning models from training to production automotive chips.
      At [QCraft](https://www.qcraft.ai/) I lead model quantization and on-device
      deployment for about 19 production driving and parking models: BEV perception,
      occupancy, vector maps, temporal tracking and end-to-end planning. They run on
      Horizon J5/J6M, NVIDIA Orin, Qualcomm and AXERA chips.
    - >-
      My work spans quantization algorithms (PTQ, QAT, quantization-aware distillation),
      bit-level numerical consistency across toolchains, latency modeling, and the
      platforms and release gates that make this repeatable. I lead a six-engineer team
      and am technical lead for bringing our urban NOA stack to a new chip family.
      Before QCraft I worked at Tencent Maps and Yitu Technology, and I studied pattern
      recognition at Beihang University.
  interests:
    - Model quantization (PTQ / QAT / QAD)
    - Efficient on-device inference
    - End-to-end autonomous driving
    - ML infrastructure and tooling


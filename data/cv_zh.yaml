profile:
  name: 杨豪
  name_alt: Yang Hao
  title: 模型量化与部署负责人
  affiliation: 轻舟智航 · 感知 ML-Infra
  avatar: /public/img/avatar.jpg
  email: howellyang@buaa.edu.cn
  github: Howell-Yang
  # 可选：把 PDF 放到 static/files/ 并填写路径，例如 /files/YangHao_CV_zh.pdf
  cv_pdf: /files/YangHao_CV_zh.pdf
  bio:
    # 中文段落请写在一行内：YAML 折行会在汉字之间插入空格。
    - "我专注于把深度学习模型从训练落地到量产车规芯片。在[轻舟智航](https://www.qcraft.ai/)，我负责约 19 个量产行车、泊车模型的量化与端侧部署，覆盖 BEV 感知、Occupancy、矢量地图、时序跟踪和端到端规划，运行平台包括地平线 J5/J6M、英伟达 Orin、高通和爱芯。"
    - "我的工作涵盖量化算法（PTQ、QAT、量化感知蒸馏）、跨工具链的逐 bit 数值一致性、耗时建模，以及让这些工作可复制的平台与发版门禁。我带领 6 人团队，并担任城市 NOA 方案迁移到新芯片的技术负责人。此前就职于腾讯地图和依图科技，硕士毕业于北京航空航天大学模式识别专业。"
  interests:
    - 模型量化（PTQ / QAT / QAD）
    - 高效端侧推理
    - 端到端自动驾驶
    - 机器学习基础设施与工具链


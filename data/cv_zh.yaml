projects:
  - title: 从 PTQ 到 QAD：与浮点模型一致的量化
    where: 轻舟智航 · 2023–2026
    page: /zh/projects/float-consistent-quantization/
    metric: "2 → 0.5"
    metric_label: 个点的量化掉点
    text: "四代量化方案（scale search PTQ、LSQ AutoQuant、带蒸馏的 QAT、大规模 QAD）随模型复杂度提升逐步引入。目标从“平均指标对齐”转向“逐 case 与浮点一致”。"
  - title: 非线性算子的自适应查表
    where: 轻舟智航 · 2026
    page: /zh/projects/adaptive-lut/
    metric: "≤ 2 LSB"
    metric_label: 最大误差，表数减少 85%
    text: "一种由误差驱动的定点查表分段算法（rsqrt、reciprocal、exp、sigmoid）：只在真实定点误差高的地方细分，每个算子用 12–30 张表即可保证最大误差不超过 2 LSB，而不是 126 张。"
  - title: 分层数值一致性与发版门禁
    where: 轻舟智航 · 2024–2026
    page: /zh/projects/numerical-consistency/
    metric: "12"
    metric_label: 个检查点，从相机数据到板端
    text: "从实车数据到板端后处理，每个阶段都在相同输入下与前一阶段比对，让每个不一致只可能来自一个地方。结论标注验证级别，历史问题在每次发版前重跑。"
  - title: 写代码之前，先预测板端耗时
    where: 轻舟智航 · 2025–2026
    page: /zh/projects/latency-modeling/
    metric: "0.7%"
    metric_label: 板端预测误差
    text: "分模块耗时模型预测 19.38 ms，实测 19.25 ms。它提前否定了 Occupancy 扩大范围加 10 Hz 的直接上线方案，对六种部署方案排序，并促成五个感知模型共享 backbone。"
  - title: QNN Web：面向所有芯片的一键模型转换
    where: 轻舟智航 · 2022–2026
    page: /zh/projects/qnn-web/
    metric: "4,273"
    metric_label: 次量产转换
    text: "上传一次模型，得到所有目标芯片的 engine。配置根据计算图自动生成，TensorRT timing cache 把编译降到约 5 分钟，MCP 接口让 AI Agent 可以提交和跟踪任务。"
  - title: 新芯片上的城市 NOA（爱芯 M95）
    where: 轻舟智航 · 2026
    page: /zh/projects/axera-m95/
    metric: "350"
    metric_label: TOPS 目标芯片
    text: "城市 NOA 方案迁移的技术负责人：从 700 TOPS 开发板到 M95 的分阶段适配、模型适配与量化、路测问题聚类。v4 方案已在测试车上运行，关键模型无掉帧。"
  - title: 云端 GPU 模型的 TensorRT INT8 与 onnx2trt
    where: 腾讯地图 · 2021–2022

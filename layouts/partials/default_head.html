{{- $lang := .Params.ui_lang | default "en" -}}
{{- $t := index .Site.Data.strings $lang -}}
<!DOCTYPE html>
<html lang="{{ $t.html_lang }}">
{{ partial "head.html" . }}
<body class="{{ if or .IsHome (eq .Type "cv") }}is-home{{ else }}is-page{{ end }} lang-{{ $lang }}">
<a class="skip-link" href="#main">{{ $t.skip }}</a>
{{ partial "site_header.html" . }}
<main id="main" class="container">
